openapi: 3.0.0

info:
  title: Huma Vlove API
  description: Authentication and Users API
  version: 1.0.0

servers:
  - url: http://localhost:8000

tags:
  - name: Authentication
    description: Authentication endpoints
  - name: Users
    description: User endpoints

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

paths:

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Ahmed
                email:
                  type: string
                  format: email
                  example: ahmed@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        "201":
          description: User created successfully
        "400":
          description: User already exists

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: ahmed@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        "200":
          description: Login successful
        "400":
          description: Invalid credentials

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logout successful
        "401":
          description: Unauthorized

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user retrieved
        "401":
          description: Unauthorized

  /api/users:
    get:
      tags:
        - Users
      summary: Get users
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of users
        "401":
          description: Unauthorized

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
          example: "123"
      responses:
        "200":
          description: User found
        "401":
          description: Unauthorized
        "404":
          description: User not found